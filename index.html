<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bel Sekolah Otomatis SLB Negeri Al-Fansury</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0066ff;
      --accent-cyan: #00d2ff;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-card: rgba(255, 255, 255, 0.95);
    }
    
    body {
      background: #f0f4f9;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: 40px;
    }

    /* HEADER KEREN */
    .app-header {
      background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
      color: white;
      border-radius: 0 0 28px 28px;
      padding: 20px 20px 25px 20px;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.25);
    }
    .school-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .school-sub {
      font-size: 0.75rem;
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* WIDGET JAM DIGITAL FUTURISTIK */
    .clock-card {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border-radius: 24px;
      padding: 25px 15px;
      color: white;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.3);
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .clock-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0,210,255,0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .digital-clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      background: linear-gradient(to right, #00d2ff, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    /* STATUS BADGE AUTOMATION */
    .auto-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* CARD JADWAL */
    .schedule-card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }
    .schedule-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .time-badge {
      background: #e6f0ff;
      color: #0066cc;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 6px 14px;
      border-radius: 12px;
    }

    .btn-modern {
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 14px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="app-header mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <div style="background: white; padding: 8px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <i class="fa-solid fa-bell text-primary fs-3"></i>
        </div>
        <div>
          <span class="school-sub">SLB NEGERI AL-FANSURY</span>
          <h1 class="school-title mt-1">BEL SEKOLAH OTOMATIS</h1>
        </div>
      </div>
      <button class="btn btn-sm btn-light border text-primary fw-bold rounded-circle p-2.5 shadow-sm" onclick="muatJadwal()">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </div>

  <div class="container px-3">
    
    <!-- WIDGET JAM DIGITAL -->
    <div class="clock-card text-center mb-4">
      <div id="namaHariTanggal" class="small text-white-50 fw-semibold text-uppercase tracking-wider mb-1">--</div>
      <div class="digital-clock my-1" id="jamDigital">00:00:00</div>
      
      <div class="mt-3">
        <div class="auto-badge">
          <span class="pulse-dot"></span>
          <span>SISTEM BEL FULL-OTOMATIS AKTIF</span>
        </div>
      </div>
    </div>

    <!-- PLAYER AUDIO -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4" style="background: white;">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="small fw-bold text-secondary" id="nowPlayingText"><i class="fa-solid fa-signal text-success me-1"></i> Status: Standby Siaga</span>
        <button class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2" style="font-size: 0.75rem;" onclick="tesBelSintetis()">
          <i class="fa-solid fa-volume-high me-1"></i> Tes Bel
        </button>
      </div>
      <audio id="audioPlayer" controls style="width: 100%; height: 36px;"></audio>
    </div>

    <!-- FILTER HARI -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="fw-bold small text-secondary text-uppercase"><i class="fa-solid fa-calendar-days me-1"></i> Jadwal Bel Hari Ini</span>
      <select id="selectHariFilter" class="form-select border-0 shadow-sm rounded-3 fw-bold text-primary" style="width: auto; font-size: 0.85rem;" onchange="tampilkanTabelJadwal()">
        <option value="HARI_INI">📅 Hari Ini</option>
        <option value="senin">Senin</option>
        <option value="selasa">Selasa</option>
        <option value="rabu">Rabu</option>
        <option value="kamis">Kamis</option>
        <option value="jumat">Jumat</option>
        <option value="sabtu">Sabtu</option>
        <option value="SEMUA">📋 Semua Hari</option>
      </select>
    </div>

    <!-- DAFTAR JADWAL -->
    <div id="daftarJadwalContainer">
      <div class="text-center py-5 text-muted small"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat data jadwal bel...</div>
    </div>

  </div>

  <!-- MODAL UPLOAD MP3 -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-0 pb-0">
          <h6 class="modal-title fw-bold" id="uploadModalTitle">Upload MP3 Bel</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="uploadForm">
            <input type="hidden" id="targetRow">
            <div class="mb-3">
              <label class="form-label small text-secondary fw-semibold">Pilih file MP3 dari HP/Laptop:</label>
              <input type="file" class="form-control rounded-3" id="audioFileInput" accept="audio/*" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3" id="btnSubmitUpload">
              📤 Unggah Sekarang
            </button>
          </form>
          <div id="uploadStatus" class="mt-2 text-center small"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxo-jf4uumsTHqvzPAsGwYixDftvZi1RuLPUMVnFdigPDF1cSHGqN9axgdlbKUP65vGGA/exec";

    let daftarJadwal = [];
    let belSudahBunyi = {};
    const namaHari = ["minggu", "senin", "selasa", "rabu", "kamis", "jumat", "sabtu"];
    let uploadModalObj;

    // SINTESIS AUDIO NATIVE (Pasti Berbunyi Otomatis Tanpa Diblokir Browser)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function bunyikanBelSintetis() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      // Melodi Bel Sekolah 2-Nada (Ding-Dong)
      const playTone = (freq, startTime, duration) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
      };

      const now = audioCtx.currentTime;
      // Nada 1 (Ding) -> Nada 2 (Dong) Diulang 3 Kali
      [0, 1.2, 2.4].forEach(delay => {
        playTone(659.25, now + delay, 0.8);       // E5
        playTone(523.25, now + delay + 0.4, 1.0); // C5
      });
    }

    function tesBelSintetis() {
      bunyikanBelSintetis();
      document.getElementById('nowPlayingText').innerText = "🔔 Menguji Suara Bel Sintetis...";
    }

    document.addEventListener("DOMContentLoaded", function() {
      uploadModalObj = new bootstrap.Modal(document.getElementById('uploadModal'));
    });

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      
      const jamSekarang = `${h}:${m}`;
      document.getElementById('jamDigital').innerText = `${h}:${m}:${s}`;
      
      const hariSekarang = namaHari[now.getDay()];
      const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      document.getElementById('namaHariTanggal').innerText = `${hariSekarang}, ${tanggal}`;

      if (s === "00") {
        cekJadwalBel(jamSekarang, hariSekarang);
      }
    }

    function muatJadwal() {
      const container = document.getElementById('daftarJadwalContainer');
      container.innerHTML = '<div class="text-center py-4 text-muted small"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat jadwal...</div>';

      fetch(`${API_URL}?action=getJadwal`)
        .then(res => res.json())
        .then(data => {
          daftarJadwal = data;
          tampilkanTabelJadwal();
        })
        .catch(err => {
          container.innerHTML = '<div class="text-center py-4 text-danger small">Gagal terhubung ke API. Silakan refresh.</div>';
        });
    }

    function tampilkanTabelJadwal() {
      const container = document.getElementById('daftarJadwalContainer');
      container.innerHTML = '';
      
      const now = new Date();
      const hariIni = namaHari[now.getDay()];
      const filterPilihan = document.getElementById('selectHariFilter').value;

      let jadwalFiltered = [];

      if (filterPilihan === "HARI_INI") {
        jadwalFiltered = daftarJadwal.filter(j => j.hari === hariIni || j.hari === 'semua');
      } else if (filterPilihan === "SEMUA") {
        jadwalFiltered = daftarJadwal;
      } else {
        jadwalFiltered = daftarJadwal.filter(j => j.hari === filterPilihan || j.hari === 'semua');
      }

      if (jadwalFiltered.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted small">Tidak ada jadwal bel untuk hari ini.</div>';
        return;
      }

      jadwalFiltered.forEach((j) => {
        const hasAudio = j.audioId !== "";
        const statusBadge = hasAudio 
          ? '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">MP3 Siap</span>' 
          : '<span class="badge bg-warning-subtle text-warning border border-warning-subtle rounded-pill">Bel Sintetis</span>';

        container.innerHTML += `
          <div class="schedule-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="time-badge"><i class="fa-regular fa-clock me-1"></i>${j.jam} WIB</span>
              <div>
                <span class="badge bg-light text-dark text-uppercase me-1">${j.hari}</span>
                ${statusBadge}
              </div>
            </div>
            
            <div class="fw-bold text-dark my-2" style="font-size: 1.05rem;">${j.keterangan}</div>
            
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-sm btn-outline-primary btn-modern w-100" onclick="bukaModalUpload(${j.rowNum}, '${j.keterangan}')">
                <i class="fa-solid fa-upload me-1"></i> Upload MP3
              </button>
              ${hasAudio ? `<button class="btn btn-sm btn-primary btn-modern w-100" onclick="putarMP3Server('${j.audioId}', '${j.keterangan}')"><i class="fa-solid fa-play me-1"></i> Tes MP3</button>` : ''}
            </div>
          </div>
        `;
      });
    }

    function bukaModalUpload(rowNum, keterangan) {
      document.getElementById('targetRow').value = rowNum;
      document.getElementById('uploadModalTitle').innerText = 'Upload MP3: ' + keterangan;
      document.getElementById('uploadStatus').innerHTML = '';
      document.getElementById('uploadForm').reset();
      uploadModalObj.show();
    }

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const targetRow = document.getElementById('targetRow').value;
      const fileInput = document.getElementById('audioFileInput');
      const file = fileInput.files[0];
      const btn = document.getElementById('btnSubmitUpload');
      const statusDiv = document.getElementById('uploadStatus');

      if (!file) return;

      btn.disabled = true;
      btn.innerText = "Mengunggah...";
      statusDiv.innerHTML = '<span class="text-primary">Memproses upload file...</span>';

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Data = evt.target.result;
        
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: "uploadAudio",
            targetRow: targetRow,
            fileData: base64Data,
            fileName: file.name
          })
        })
        .then(res => res.json())
        .then(res => {
          btn.disabled = false;
          btn.innerText = "📤 Unggah Sekarang";
          if (res.status === "SUCCESS") {
            statusDiv.innerHTML = '<span class="text-success fw-bold">✅ Berhasil Diunggah!</span>';
            setTimeout(() => {
              uploadModalObj.hide();
              muatJadwal();
            }, 800);
          } else {
            statusDiv.innerHTML = '<span class="text-danger">❌ Gagal: ' + res.message + '</span>';
          }
        })
        .catch(err => {
          btn.disabled = false;
          statusDiv.innerHTML = '<span class="text-danger">❌ Error API Upload</span>';
        });
      };

      reader.readAsDataURL(file);
    });

    function cekJadwalBel(jamSekarang, hariSekarang) {
      daftarJadwal.forEach(j => {
        const cocokHari = (j.hari === hariSekarang || j.hari === 'semua');
        const cocokJam = (j.jam === jamSekarang);
        const key = `${hariSekarang}_${jamSekarang}_${j.keterangan}`;

        if (cocokHari && cocokJam && !belSudahBunyi[key]) {
          belSudahBunyi[key] = true;
          
          if (j.audioId !== "") {
            // Putar MP3 jika file audio ada
            putarMP3Server(j.audioId, j.keterangan);
          } else {
            // JIKA FILE MP3 KOSONG: Otomatis bunyikan bel nada sintetis!
            document.getElementById('nowPlayingText').innerText = `🔔 Bel Berbunyi: ${j.keterangan}`;
            bunyikanBelSintetis();
          }
        }
      });
    }

    function putarMP3Server(audioId, keterangan) {
      if (!audioId) return;

      const player = document.getElementById('audioPlayer');
      document.getElementById('nowPlayingText').innerText = `⏳ Memuat Audio MP3...`;

      fetch(`${API_URL}?action=getAudio&audioId=${audioId}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "SUCCESS" && res.data) {
            document.getElementById('nowPlayingText').innerText = `▶️ Memutar MP3: ${keterangan}`;
            player.src = "data:audio/mp3;base64," + res.data;
            player.play().catch(e => {
              // Cadangan otomatis jika MP3 diblokir: Bunyikan bel sintetis!
              bunyikanBelSintetis();
            });
          } else {
            bunyikanBelSintetis();
          }
        })
        .catch(err => {
          bunyikanBelSintetis();
        });
    }

    setInterval(updateClock, 1000);
    setInterval(muatJadwal, 60000);
    muatJadwal();
  </script>
</body>
</html>
